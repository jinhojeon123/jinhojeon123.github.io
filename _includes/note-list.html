<ul class="note-list{% if include.meta == false %} note-list--compact{% endif %}">
  {% for note in include.posts %}
    <li>
      <a href="{{ note.url | relative_url }}">{{ note.title | escape }}</a>
      {% unless include.meta == false %}<span class="note-meta">{{ note.date | date: '%Y-%m-%d' }} · {{ note.status | default: 'note' | replace: '-', ' ' }}</span>{% endunless %}
    </li>
  {% endfor %}
</ul>
