# The Site Configuration

# Import the theme
remote_theme: cotes2020/jekyll-theme-chirpy

# The language of the webpage
lang: en

# Change to your timezone
timezone: Asia/Seoul

# jekyll-seo-tag settings
title: JIN HO JEON 
tagline: A student preparing for a master's degree in Computational and Mathematical Sciences
description: >-
  A minimal, responsive and feature-rich Jekyll theme for technical writing.

# Fill in the protocol & hostname for your site.
url: "https://jinhojeon123.github.io"

github:
  username: jinhojeon123

twitter:
  username: twitter_username

social:
  name: JIN HO JEON
  email: rhsek@naver.com
  links:
    - https://twitter.com/username
    - https://github.com/jinhojeon123
    - http://www.linkedin.com/in/jin-ho-jeon

# Site Verification Settings
webmaster_verifications:
  google: "ReZfrD1F6CgIdGUkr0pgft4k0-XZKCGQDIhqQddsGWI"
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# Web Analytics Settings
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page views settings
pageviews:
  provider:

# Prefer color scheme setting.
theme_mode:

# The CDN endpoint for media resources.
cdn:

# the avatar on sidebar
avatar: /assets/img/JINHOJEON_profile.jpg

# The URL of the site-wide social preview image
social_preview_image:

# boolean type, the global switch for TOC in posts.
toc: true

comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# Self-hosted static assets
assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

# Pagination Settings
paginate: 10

# The base URL of your site
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
  math_engine: mathjax

collections:
  tabs:
    output: true
    sort_by: order

# -----------------------------------------------------------
# [중요] 수정된 부분: jekyll-paginate 및 feed 추가
# -----------------------------------------------------------
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate  # 페이징 기능을 위해 필수
  - jekyll-feed      # RSS 피드 기능

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
      math: true

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - package-lock.json
  - package.json
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/