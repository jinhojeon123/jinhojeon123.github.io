name: Build and deploy Jekyll

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete post history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby and install locked dependencies
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Validate content conventions
        run: bundle exec ruby tools/validate.rb

      - name: Build and check production site
        run: bash tools/test.sh

      - name: Check mathematics, code, references, and preview base URL
        run: |
          bundle exec ruby tools/render-smoke.rb
          bundle exec htmlproofer _site-smoke --disable-external

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
